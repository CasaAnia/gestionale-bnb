# Test a ogni push, su main e su ogni ramo (17/11/2026). Serve come secondo controllo e come
# storico visibile accanto a quello di Vercel, che lancia gli stessi test prima della build
# (package.json: "build": "npm test && next build --webpack"). Nessun segreto, nessuna scrittura.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
